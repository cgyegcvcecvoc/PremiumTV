# Fly.io config — deploy with:
#   flyctl launch --copy-config --no-deploy   (accept the app name or change it)
#   flyctl deploy
app = "premiumtv-hub"
primary_region = "ewr"   # Newark — closest region to NE Pennsylvania

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
