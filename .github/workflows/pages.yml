name: Deploy download site (GitHub Pages)

# Publishes docs/ to GitHub Pages: the download page for the apps, the
# per-country M3U picker and the change log (with its Atom feed).
#
# The site is static; scripts/build_site_data.py only regenerates its data
# files from the repository (playlists, reports, CHANGELOG.md) so the page
# always shows current counts and changelog entries.
#
# The first run asks GitHub to enable Pages, but GitHub currently denies that
# admin operation to workflow/integration tokens. If Pages is still disabled,
# the summary explains the one-time owner action: Settings -> Pages -> Source:
# GitHub Actions. After that, changes and release publications deploy normally.

on:
  workflow_dispatch:
  release:
    types: [published]
  # Data workflows commit with GITHUB_TOKEN, whose pushes do not recursively
  # trigger push workflows. Deploy after their runs so automated scrapes and
  # repairs update the public site too.
  workflow_run:
    workflows:
      - Scrape playlists
      - Quick playlist update
      - Deep link and guide check
      - Build merged and country EPG guides
      - Biweekly deep cleanup
      - Monthly discovery
    types: [completed]
    branches: [main]
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
      - "web/**"
      - "hub/**"
      - "CHANGELOG.md"
      - "release-notes-*.md"
      - "playlists/PremiumTV.m3u"
      - "playlists/Priority_Channels.m3u"
      - "playlists/AE_Channels.m3u"
      - "playlists/countries/**"
      # The USA bundle, shelf and site all read the live feed now, so a
      # change there has to rebuild them too.
      - "playlists/live/**"
      - "playlists/local-channels.json"
      - "data/local-markets/**"
      - "scripts/build_local_channels.py"
      - "playlists/report.json"
      - "playlists/STATUS.md"
      - "categories/**"
      - "playlists/categories/**"
      - "EPG/**"
      # build-out/ is otherwise ignored/ignored-on-push now; only this small
      # checksum file is still tracked and read by the site generator.
      - "build-out/SHA256SUMS.txt"
      - "scripts/build_site_data.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write
  # actions/deploy-pages lists the run's uploaded artifact through the Actions
  # API; without this scope that lookup returns 404 and the deploy fails with
  # "No artifacts named github-pages were found for this workflow run" even
  # though the artifact was uploaded (which is what broke every deploy after
  # 21:19 on 2026-11-23, and so left the 1.1.20 download page unpublished).
  actions: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  # A release event runs this workflow at the tag ref, and the github-pages
  # environment only allows deployments from main. Rather than fail on every
  # release, ask the main-branch copy of this workflow to redeploy once the
  # release (and, soon after, its attached installers) exists.
  redeploy-after-release:
    name: Redeploy after a release
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The workflow-level `pages-deploy` group cancels in-flight runs when the
    # next deploy starts, and a scheduled data run deploys every few hours.
    # This job waits up to 45 minutes for the installers, so it needs a group of
    # its own or an unrelated scrape would cancel the wait and redeploy the
    # site before the release was complete.
    concurrency:
      group: release-promotion
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Wait for this release's installers
        # The release event fires the moment the release exists, minutes before
        # the APK (emulator smoke gate) and the four Mac installers finish
        # uploading. Redeploying straight away would publish the *previous*
        # complete release as the stable card and leave 1.1.2 unpromoted until
        # the next data run happened to touch the site. Wait for the files
        # instead, so the page and the release agree, then redeploy.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -uo pipefail
          version="${TAG#v}"
          mac=$(python3 scripts/release_version.py --macos "$version" 2>/dev/null || printf '%s' "$version")
          required="PremiumTV-$version-debug.apk"
          for arch in arm64 x64; do
            for ext in dmg pkg; do
              required="$required PremiumTV-$mac-mac-$arch.$ext"
            done
          done
          deadline=$((SECONDS + 2700))
          while :; do
            assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq '[.assets[].name] | join(" ")' 2>/dev/null || true)
            missing=""
            for want in $required; do
              case " $assets " in
                *" $want "*) ;;
                *) missing="$missing $want" ;;
              esac
            done
            if [ -z "$missing" ]; then
              echo "Every installer for $TAG is attached."
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::warning::Still waiting for:$missing - redeploying with the newest complete release."
              break
            fi
            echo "Waiting for:$missing"
            sleep 60
          done

      - name: Ask the main-branch site deploy to pick up the new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_rest.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh published GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | {tag: .tag_name, name, draft, prerelease, published_at, html_url, assets: [.assets[] | {name, size, digest, browser_download_url}]}]' \
            > docs/data/releases.src.json

      - name: Regenerate site data from the repository
        run: python scripts/build_site_data.py

      # The 2026-11-19 Pages run failed four web local-channel tests because a
      # data run had published a USA playlist without rebuilding the market
      # directory from it (WGAL/Lancaster were missing). A deployment reads the
      # committed document, so repair it from the checked feed before npm test
      # and the web export; the publishing data workflows commit this output.
      - name: Self-heal the local-market directory before the web build
        run: |
          python scripts/build_local_channels.py
          python scripts/build_local_channels.py --check

      - name: Build the full download hub alongside the download page
        run: |
          python hub/build_data.py
          python hub/export_static.py
          cp -a hub/dist/static-site docs/hub

      # The web player is a separate static app under /web/. This publishes
      # web files only; it does not bump VERSION or create a native release.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and verify the independent web player
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
          python tools/verify_export.py
          cp -a dist ../docs/web
        working-directory: web

      - name: Enable Pages (first run) and configure the deployment
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages is not enabled for this repository yet
        if: steps.pages.outcome != 'success'
        run: |
          {
            echo "### GitHub Pages is not enabled for this repository yet"
            echo ""
            echo "The site is generated and ready to publish, but creating a Pages"
            echo "site is an admin action that neither \`GITHUB_TOKEN\` nor app"
            echo "integration tokens are allowed to perform on this repository."
            echo ""
            echo "**One manual step (15 seconds):**"
            echo ""
            echo "1. Open **Settings \u2192 Pages** on this repository."
            echo "2. Under **Source**, choose **GitHub Actions**."
            echo "3. Re-run this workflow (*Actions \u2192 Deploy download site \u2192 Run workflow*),"
            echo "   or push any \`docs/\` change - the site publishes automatically from then on,"
            echo "   at https://cgyegcvcecvoc.github.io/PremiumTV/ ."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pages is not enabled yet - see the run summary for the one-click fix." >&2
          exit 1

      - name: Upload the site
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # actions/deploy-pages@v4 resolves the uploaded artifact through the new
      # Actions artifact service. That lookup has intermittently returned an
      # empty list right after upload ("Fetching artifact metadata failed..."),
      # even though the github-pages artifact is attached to the run. Try the
      # official action once, then fall back to the Pages REST deployment: it
      # reads the artifact ID from the public Actions API and creates the
      # deployment directly, so it never uses the failing metadata lookup.
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Retry the GitHub Pages deployment through the REST API
        id: deployment_rest
        if: steps.pages.outcome == 'success' && steps.deployment.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id=""
          for attempt in $(seq 1 10); do
            artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages" and (.expired | not)) | .id' \
              2>/dev/null | head -n1 || true)
            if [ -n "$artifact_id" ]; then
              break
            fi
            echo "Waiting for the github-pages artifact to become visible (attempt ${attempt}/10)..."
            sleep 6
          done
          if [ -z "$artifact_id" ]; then
            echo "::error::No unexpired github-pages artifact was visible through the Actions API after 60 seconds"
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::The OIDC token request is unavailable; id-token: write is required"
            exit 1
          fi
          if ! oidc=$(curl -fsS --retry 3 --retry-delay 2 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}"); then
            echo "::error::Could not obtain an OIDC token from the Actions runtime"
            exit 1
          fi
          oidc_token=$(printf '%s' "$oidc" | jq -r '.value')
          if [ -z "$oidc_token" ] || [ "$oidc_token" = null ]; then
            echo "::error::The OIDC token response had no value"
            exit 1
          fi
          echo "::add-mask::$oidc_token"
          payload=$(jq -n --argjson artifact_id "$artifact_id" \
            --arg version "$GITHUB_SHA" --arg token "$oidc_token" \
            '{artifact_id: $artifact_id, pages_build_version: $version, oidc_token: $token}')
          if ! response=$(printf '%s' "$payload" | \
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments" --input -); then
            echo "::error::Creating the Pages deployment failed"
            exit 1
          fi
          deployment_id=$(printf '%s' "$response" | \
            jq -r '.id // ((.status_url // "") | split("/") | last)')
          page_url=$(printf '%s' "$response" | jq -r '.page_url // ""')
          if [ -z "$deployment_id" ] || [ "$deployment_id" = null ]; then
            echo "::error::The Pages deployment response had no id"
            exit 1
          fi
          echo "page_url=$page_url" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 120); do
            if ! status=$(gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/${deployment_id}" \
              --jq '.status' 2>/dev/null); then
              echo "Pages deployment status check failed (attempt ${attempt}/120); retrying..."
              sleep 5
              continue
            fi
            echo "Pages deployment status (attempt ${attempt}/120): ${status:-unknown}"
            case "$status" in
              succeed)
                echo "Pages deployment ${deployment_id} succeeded"
                exit 0
                ;;
              deployment_failed|deployment_perms_error|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "::error::Pages deployment ended with ${status}"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "::error::Pages deployment ${deployment_id} did not finish within 10 minutes"
          exit 1

      # A green deployment means GitHub accepted the build, not that the CDN is
      # already serving it. Compare every generated data file with the exact
      # file in this run's artifact; a dropped or stale deployment fails the
      # job instead of quietly keeping the previous download page live.
      - name: Verify the live site serves this build
        if: success() && (steps.deployment.outcome == 'success' || steps.deployment_rest.outcome == 'success')
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url || steps.deployment_rest.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL:-}"
          base="${base%/}"
          if [ -z "$base" ]; then
            base="https://cgyegcvcecvoc.github.io/PremiumTV"
          fi
          data_files=(site-data.js site.json changelog.json feed.xml)
          for attempt in $(seq 1 18); do
            stale=""
            for file in "${data_files[@]}"; do
              live=$(mktemp)
              if ! curl -fsSL --compressed --retry 2 --retry-delay 2 \
                -H 'Cache-Control: no-cache' \
                "${base}/data/${file}?deploy=${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}-${attempt}" \
                -o "$live"; then
                stale="$file (fetch failed)"
                rm -f "$live"
                break
              fi
              if ! cmp -s "$live" "docs/data/$file"; then
                stale="$file"
                rm -f "$live"
                break
              fi
              rm -f "$live"
            done
            if [ -z "$stale" ]; then
              echo "Live site data matches this build (${GITHUB_RUN_ID:-local})."
              exit 0
            fi
            echo "Live data not current yet: ${stale} (attempt ${attempt}/18); retrying..."
            sleep 10
          done
          echo "::error::Live site data at ${base}/data/ is not this build after 3 minutes (${stale})"
          exit 1
