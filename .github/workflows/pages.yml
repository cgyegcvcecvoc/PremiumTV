name: Deploy download site (GitHub Pages)

# Publishes docs/ to GitHub Pages: the download page for the apps, the
# per-country M3U picker and the change log (with its Atom feed).
#
# The site is static; scripts/build_site_data.py only regenerates its data
# files from the repository (playlists, reports, CHANGELOG.md) so the page
# always shows current counts and changelog entries.
#
# The first run asks GitHub to enable Pages, but GitHub currently denies that
# admin operation to workflow/integration tokens. If Pages is still disabled,
# the summary explains the one-time owner action: Settings -> Pages -> Source:
# GitHub Actions. After that, changes and release publications deploy normally.

on:
  workflow_dispatch:
  release:
    types: [published]
  # Data workflows commit with GITHUB_TOKEN, whose pushes do not recursively
  # trigger push workflows. Deploy after their runs so automated scrapes and
  # repairs update the public site too.
  workflow_run:
    workflows:
      - Scrape playlists
      - Quick playlist update
      - Deep link and guide check
      - Build merged and country EPG guides
      - Biweekly deep cleanup
      - Monthly discovery
    types: [completed]
    branches: [main]
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
      - "hub/**"
      - "CHANGELOG.md"
      - "release-notes-*.md"
      - "playlists/PremiumTV.m3u"
      - "playlists/Priority_Channels.m3u"
      - "playlists/AE_Channels.m3u"
      - "playlists/countries/**"
      # The USA bundle, shelf and site all read the live feed now, so a
      # change there has to rebuild them too.
      - "playlists/live/**"
      - "playlists/report.json"
      - "playlists/STATUS.md"
      - "categories/**"
      - "playlists/categories/**"
      - "EPG/**"
      # build-out/ is otherwise ignored/ignored-on-push now; only this small
      # checksum file is still tracked and read by the site generator.
      - "build-out/SHA256SUMS.txt"
      - "scripts/build_site_data.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  # A release event runs this workflow at the tag ref, and the github-pages
  # environment only allows deployments from main. Rather than fail on every
  # release, ask the main-branch copy of this workflow to redeploy once the
  # release (and, soon after, its attached installers) exists.
  redeploy-after-release:
    name: Redeploy after a release
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Ask the main-branch site deploy to pick up the new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh published GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | {tag: .tag_name, name, draft, prerelease, published_at, html_url, assets: [.assets[] | {name, size, digest, browser_download_url}]}]' \
            > docs/data/releases.src.json

      - name: Regenerate site data from the repository
        run: python scripts/build_site_data.py

      - name: Build the full download hub alongside the download page
        run: |
          python hub/build_data.py
          python hub/export_static.py
          cp -a hub/dist/static-site docs/hub

      - name: Enable Pages (first run) and configure the deployment
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages is not enabled for this repository yet
        if: steps.pages.outcome != 'success'
        run: |
          {
            echo "### GitHub Pages is not enabled for this repository yet"
            echo ""
            echo "The site is generated and ready to publish, but creating a Pages"
            echo "site is an admin action that neither \`GITHUB_TOKEN\` nor app"
            echo "integration tokens are allowed to perform on this repository."
            echo ""
            echo "**One manual step (15 seconds):**"
            echo ""
            echo "1. Open **Settings \u2192 Pages** on this repository."
            echo "2. Under **Source**, choose **GitHub Actions**."
            echo "3. Re-run this workflow (*Actions \u2192 Deploy download site \u2192 Run workflow*),"
            echo "   or push any \`docs/\` change - the site publishes automatically from then on,"
            echo "   at https://cgyegcvcecvoc.github.io/PremiumTV1/ ."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pages is not enabled yet - see the run summary for the one-click fix." >&2
          exit 1

      - name: Upload the site
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
