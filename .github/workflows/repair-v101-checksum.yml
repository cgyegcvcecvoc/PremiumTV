name: Repair v1.0.1 Android checksum asset (one-off)

# One-off repair, to be deleted once it has run: the published v1.0.1 asset
# SHA256SUMS-android.txt was lost when a `gh release upload --clobber` from a
# network-restricted environment deleted the old asset and then failed to
# upload the replacement. This job runs where release downloads/uploads work:
# it downloads the APK that is actually on the v1.0.1 release, checksums that
# exact file, and re-uploads a one-line SHA256SUMS-android.txt.
#
# It triggers only on pushes to main that touch this file (i.e. the merge
# that adds it, and the merge that deletes it - a deleted workflow does not
# run, so the deletion is safe).

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-v101-checksum.yml"

permissions:
  contents: write

concurrency:
  group: repair-v101-checksum
  cancel-in-progress: false

jobs:
  repair:
    name: Restore SHA256SUMS-android.txt on v1.0.1
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Rebuild the checksum from the published APK and re-upload it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cd "$work"
          gh release download v1.0.1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'PremiumTV-1.0.1-debug.apk'
          sha256sum PremiumTV-1.0.1-debug.apk > SHA256SUMS-android.txt
          cat SHA256SUMS-android.txt
          gh release upload v1.0.1 SHA256SUMS-android.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '"release now carries: " + ([.assets[].name] | join(", "))'
