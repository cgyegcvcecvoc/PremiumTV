name: Build PremiumTV macOS DMG + PKG

# Builds the Mac app the same way a developer would, but on a real macOS
# runner (the only place productbuild and codesign exist): bakes the channel
# list and guide into the app, vendors the players, packages a .dmg and a .pkg
# for both Intel and Apple Silicon, ad-hoc signs the .app, and publishes the
# installers to the release page plus an Actions artifact.
#
# The repository is private, so the artifacts are only downloadable by people
# with repository access - which is exactly who installs test builds.

on:
  push:
    branches:
      - "**"
    paths:
      - "macos/**"
      - "playlists/countries/**"
      - "playlists/PremiumTV.m3u"
      - "categories/index.json"
      - "EPG/**"
      - "android/tools/build_bundle.py"
      - ".github/workflows/macos-build.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Build 1.0.2 stable or 1.1.0 preview (global library + cable guide)."
        type: choice
        options:
          - 1.0.2
          - 1.1.0
        default: 1.0.2
        required: true
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DMG + PKG
    # A release for Android must not start a Mac build (or upload Mac files
    # to an Android-only release). The official release carries both platforms,
    # so both build workflows attach to it. Push/dispatch builds still run as
    # usual.
    if: github.event_name != 'release' || (github.event.release.tag_name == 'v1.0.2' && !github.event.release.prerelease) || (github.event.release.tag_name == 'v1.1.0' && github.event.release.prerelease)
    runs-on: macos-14
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', github.event.inputs.version || '1.0.2') }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: macos/app/package-lock.json

      - name: Install dependencies
        working-directory: macos/app
        run: npm ci

      - name: Resolve version and bundle scope
        id: release-config
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            case "$RELEASE_TAG:$RELEASE_PRERELEASE" in
              v1.0.2:false) version=1.0.2; scope=usa ;;
              v1.1.0:true) version=1.1.0; scope=all ;;
              *) echo "Unsupported tag/prerelease combination: $RELEASE_TAG:$RELEASE_PRERELEASE"; exit 1 ;;
            esac
          else
            version="${INPUT_VERSION:-1.0.2}"
            case "$version" in
              1.0.2) scope=usa ;;
              1.1.0) scope=all ;;
              *) echo "Unsupported PremiumTV version: $version"; exit 1 ;;
            esac
          fi
          {
            echo "VERSION=$version"
            echo "BUNDLE_SCOPE=$scope"
          } >> "$GITHUB_ENV"
          echo "Building PremiumTV $version (scope=$scope)."

      - name: Set the packaged app version
        working-directory: macos/app
        run: |
          current_version=$(node -p "require('./package.json').version")
          if [ "$current_version" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version --ignore-scripts
          fi

      - name: Bake the selected playlist and guide into the app
        working-directory: macos/app
        run: PREMIUMTV_SCOPE="$BUNDLE_SCOPE" PREMIUMTV_VERSION="$VERSION" npm run bundle

      - name: Vendor the player libraries
        working-directory: macos/app
        run: npm run assets

      - name: Run the app's unit tests
        working-directory: macos/app
        run: npm test

      # The .pkg target writes a fixed intermediate file (com.<id>.pkg), so two
      # archs must not build pkg in the same process - they race and unlink each
      # other's file. Build dmg+zip for both archs, then pkg per arch from the
      # already-signed app.
      - name: Build .dmg and .zip for Intel and Apple Silicon
        working-directory: macos/app
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/macos/build-out"
          npx electron-builder --mac dmg zip --x64 --arm64 2>&1 \
            | tee "$GITHUB_WORKSPACE/macos/build-out/build-log.txt"

      - name: Build the Intel .pkg
        working-directory: macos/app
        run: |
          set -o pipefail
          npx electron-builder --mac pkg --x64 --prepackaged dist/mac/PremiumTV.app 2>&1 \
            | tee -a "$GITHUB_WORKSPACE/macos/build-out/build-log.txt"

      - name: Build the Apple Silicon .pkg
        working-directory: macos/app
        run: |
          set -o pipefail
          npx electron-builder --mac pkg --arm64 --prepackaged dist/mac-arm64/PremiumTV.app 2>&1 \
            | tee -a "$GITHUB_WORKSPACE/macos/build-out/build-log.txt"

      - name: Verify the installed app contains channels and the renderer
        working-directory: macos/app
        run: |
          for arch in mac mac-arm64; do
            resources="dist/$arch/PremiumTV.app/Contents/Resources"
            test -s "$resources/bundle/channels.jsonl"
            test -s "$resources/bundle/meta.json"
            test -s "$resources/app.asar"
            node -e 'const fs=require("fs"); const meta=JSON.parse(fs.readFileSync(process.argv[1])); if(meta.channel_count < 1 || meta.version !== process.env.VERSION) process.exit(1); if(process.env.BUNDLE_SCOPE === "all" && !meta.preview_features.includes("cable-guide")) process.exit(1); if(process.env.BUNDLE_SCOPE === "usa" && meta.preview_features.includes("cable-guide")) process.exit(1)' "$resources/bundle/meta.json"
          done

      - name: Smoke test the packaged app on Apple Silicon and Intel (Rosetta)
        working-directory: macos/app
        run: |
          set -euo pipefail
          for arch in mac mac-arm64; do
            "dist/$arch/PremiumTV.app/Contents/MacOS/PremiumTV" --smoke-test
          done

      - name: Checksum the installers
        working-directory: macos/app/dist
        run: shasum -a 256 *.dmg *.pkg > SHA256SUMS-macos.txt

      - name: Upload installers as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: PremiumTV-macOS-installers
          path: |
            macos/app/dist/*.dmg
            macos/app/dist/*.pkg
            macos/app/dist/SHA256SUMS-macos.txt
          if-no-files-found: error

      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          tag="${tag:-$RELEASE_TAG}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag does not exist; installers remain in the Actions artifact."
            exit 0
          fi
          # A branch build made after the tagged release must never overwrite
          # its installers with a different commit's bundle or app code.
          tagged=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
          # GitHub creates a draft release's tag only when it is published.
          # Permit uploads to an untagged draft only for its exact target SHA.
          if [ -z "$tagged" ]; then
            tagged=$(gh release view "$tag" --json isDraft,targetCommitish --jq 'if .isDraft then .targetCommitish else "" end')
          fi
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "Release $tag points to $tagged, not $GITHUB_SHA; leaving its assets intact."
            exit 0
          fi
          gh release upload "$tag" \
            macos/app/dist/*.dmg \
            macos/app/dist/*.pkg \
            macos/app/dist/SHA256SUMS-macos.txt --clobber
          gh release view "$tag" --json assets --jq '"release now carries: " + ([.assets[].name] | join(", "))'

      # Publish the build log to the branch even on failure, because uploaded
      # Actions logs are not readable from every environment. The [skip ci]
      # marker and the path filter keep this from re-triggering a build.
      - name: Publish build log to the branch
        if: always()
        run: |
          set -uo pipefail
          mkdir -p macos/build-out
          if [ -f macos/build-out/build-log.txt ]; then
            tail -c 400000 macos/build-out/build-log.txt > macos/build-out/build-log.tail.txt
            mv macos/build-out/build-log.tail.txt macos/build-out/build-log.txt
          else
            echo "no build log produced" > macos/build-out/build-log.txt
          fi
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Ref ${GITHUB_REF_NAME} is a ${GITHUB_REF_TYPE}, not a branch: nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f macos/build-out
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git commit -m "ci: publish mac build log (run ${{ github.run_number }}) [skip ci]"
          # Android and Mac build on the same push and may publish their logs
          # in either order. Rebase over the other job's log commit instead of
          # failing a successful installer build with a non-fast-forward push.
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
