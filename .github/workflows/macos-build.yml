name: Build PremiumTV macOS DMG + PKG

# Builds the Mac app the same way a developer would, but on a real macOS
# runner (the only place productbuild and codesign exist): bakes the channel
# list and guide into the app, vendors the players, packages a .dmg and a .pkg
# for both Intel and Apple Silicon, ad-hoc signs the .app, and publishes the
# installers to the release page plus an Actions artifact.
#
# Stable releases attach only to full releases. Versions come from
# scripts/release_version.py, so a new stable release always lands above the
# installed version.

on:
  push:
    branches:
      - "**"
    paths:
      - "macos/**"
      - "playlists/countries/**"
      # The USA bundle, shelf and site all read the live feed now, so a
      # change there has to rebuild them too.
      - "playlists/live/**"
      - "playlists/PremiumTV.m3u"
      - "categories/index.json"
      - "EPG/**"
      - "android/tools/build_bundle.py"
      - "scripts/release_version.py"
      - ".github/workflows/macos-build.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (for example 1.0.8.1 stable)"
        type: string
        default: "1.0.8.1"
        required: true
      channel:
        description: "Release channel: stable = USA lineup, preview = global lineup"
        type: choice
        options:
          - stable
          - preview
        default: stable
        required: true
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DMG + PKG
    # Every published release is built for both platforms. The upload step
    # below still requires the release tag to point at this exact commit
    runs-on: macos-14
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', github.event.inputs.version || '1.0.8.1') }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: macos/app/package-lock.json

      - name: Install dependencies
        working-directory: macos/app
        run: npm ci

      - name: Resolve version and bundle scope
        id: release-config
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            version=$(python3 scripts/release_version.py --normalize "$RELEASE_TAG") || {
              echo "Unsupported release tag: $RELEASE_TAG"; exit 1; }
            if [ "$RELEASE_PRERELEASE" = "true" ]; then channel=preview; else channel=stable; fi
          else
            version="${INPUT_VERSION:-1.0.8.1}"
            channel="${INPUT_CHANNEL:-stable}"
            version=$(python3 scripts/release_version.py --normalize "$version") || {
              echo "Unsupported PremiumTV version: $version"; exit 1; }
          fi
          if [ "$channel" = "preview" ]; then scope=all; else scope=usa; fi
          # macOS packaging rejects four-part versions. A hotfix such as 1.0.6.1
          # is therefore packaged as its three-part compatibility alias (1.0.7);
          # patch releases use the V scheme — 1.0.8.1 (V1) as 1.0.9, 1.0.8.2 as
          # 1.0.10 … — that alias release carries the Mac installers.
          macos_version=$(python3 scripts/release_version.py --macos "$version")
          {
            echo "VERSION=$version"
            echo "MACOS_VERSION=$macos_version"
            echo "RELEASE_TAG=v$version"
            echo "BUNDLE_SCOPE=$scope"
            echo "CHANNEL=$channel"
          } >> "$GITHUB_ENV"
          echo "Building PremiumTV $macos_version for macOS ($channel, scope=$scope; release version $version)."

      - name: Set the packaged app version
        working-directory: macos/app
        run: |
          # npm's own `npm version` rejects a four-part version such as 1.0.6.1
          # and the patch line does too (1.0.8.1). Write the two files
          # electron-builder and app.getVersion() read instead; the lockfile's
          # root entry must agree or `npm ci` refuses the tree.
          node - "$MACOS_VERSION" <<'NODE'
          const fs = require('node:fs');
          const version = process.argv[2];
          for (const file of ['package.json', 'package-lock.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            data.version = version;
            if (data.packages && data.packages['']) data.packages[''].version = version;
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          }
          NODE
          node -p "'packaged app version: ' + require('./package.json').version"

      - name: Bake the selected playlist and guide into the app
        working-directory: macos/app
        run: PREMIUMTV_SCOPE="$BUNDLE_SCOPE" PREMIUMTV_VERSION="$MACOS_VERSION" npm run bundle

      - name: Vendor the player libraries
        working-directory: macos/app
        run: npm run assets

      - name: Run the app's unit tests
        working-directory: macos/app
        run: npm test

      # The .pkg target writes a fixed intermediate file (com.<id>.pkg), so two
      # archs must not build pkg in the same process - they race and unlink each
      # other's file. Build dmg+zip for both archs, then pkg per arch from the
      # already-signed app.
      - name: Build .dmg and .zip for Intel and Apple Silicon
        working-directory: macos/app
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/macos/build-out"
          npx electron-builder --mac dmg zip --x64 --arm64 2>&1 \
            | tee "$GITHUB_WORKSPACE/macos/build-out/build-log.txt"

      - name: Build the Intel .pkg
        working-directory: macos/app
        run: |
          set -o pipefail
          npx electron-builder --mac pkg --x64 --prepackaged dist/mac/PremiumTV.app 2>&1 \
            | tee -a "$GITHUB_WORKSPACE/macos/build-out/build-log.txt"

      - name: Build the Apple Silicon .pkg
        working-directory: macos/app
        run: |
          set -o pipefail
          npx electron-builder --mac pkg --arm64 --prepackaged dist/mac-arm64/PremiumTV.app 2>&1 \
            | tee -a "$GITHUB_WORKSPACE/macos/build-out/build-log.txt"

      - name: Verify the installed app contains channels and the renderer
        working-directory: macos/app
        run: |
          for arch in mac mac-arm64; do
            resources="dist/$arch/PremiumTV.app/Contents/Resources"
            test -s "$resources/bundle/channels.jsonl"
            test -s "$resources/bundle/meta.json"
            test -s "$resources/app.asar"
            node -e 'const fs=require("fs"); const meta=JSON.parse(fs.readFileSync(process.argv[1])); if(meta.channel_count < 1 || meta.version !== process.env.MACOS_VERSION) process.exit(1); if(process.env.BUNDLE_SCOPE === "all" && !meta.preview_features.includes("cable-guide")) process.exit(1); if(process.env.BUNDLE_SCOPE === "usa" && meta.preview_features.includes("cable-guide")) process.exit(1)' "$resources/bundle/meta.json"
          done

      - name: Smoke test the packaged app on Apple Silicon and Intel (Rosetta)
        working-directory: macos/app
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/macos/build-out"
          for arch in mac mac-arm64; do
            # The smoke test opens the Guide tab too; a preview build saves a
            # screenshot of the cable-style grid next to the build log.
            shot=""
            if [ "$BUNDLE_SCOPE" = "all" ]; then shot="$GITHUB_WORKSPACE/macos/build-out/guide-$arch.png"; fi
            PREMIUMTV_SMOKE_SHOT="$shot" "dist/$arch/PremiumTV.app/Contents/MacOS/PremiumTV" --smoke-test
          done

      - name: Checksum the installers
        working-directory: macos/app/dist
        run: shasum -a 256 *.dmg *.pkg > SHA256SUMS-macos.txt

      - name: Upload installers as an Actions artifact
        uses: actions/upload-artifact@v6
        with:
          name: PremiumTV-macOS-installers-${{ env.MACOS_VERSION }}
          path: |
            macos/app/dist/*.dmg
            macos/app/dist/*.pkg
            macos/app/dist/SHA256SUMS-macos.txt
          if-no-files-found: error

      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          tag="${tag:-$RELEASE_TAG}"
          # A four-part release (1.0.6.1) has no macOS build of its own: the Mac
          # installers are 1.0.7 and attach to the v1.0.7 release.
          if [ "v$MACOS_VERSION" != "$tag" ]; then
            echo "Mac installers are $MACOS_VERSION; leaving them for v$MACOS_VERSION."
            exit 0
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag does not exist; installers remain in the Actions artifact."
            exit 0
          fi
          # A branch build made after the tagged release must never overwrite
          # its installers with a different commit's bundle or app code.
          tagged=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
          # GitHub creates a draft release's tag only when it is published.
          # Permit uploads to an untagged draft only for its exact target SHA.
          if [ -z "$tagged" ]; then
            tagged=$(gh release view "$tag" --json isDraft,targetCommitish --jq 'if .isDraft then .targetCommitish else "" end')
          fi
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            # Every release keeps the exact-SHA gate: a later branch build must
            # never overwrite the installers attached to a published tag.
            echo "Release $tag points to $tagged, not $GITHUB_SHA; keeping its assets."
            exit 0
          fi
          printf 'PremiumTV %s\nSource commit: %s\nBuild: https://github.com/%s/actions/runs/%s\n' "$MACOS_VERSION" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > macos/app/dist/BUILD-SOURCE-macos.txt
          gh release upload "$tag" \
            macos/app/dist/*.dmg \
            macos/app/dist/*.pkg \
            macos/app/dist/SHA256SUMS-macos.txt macos/app/dist/BUILD-SOURCE-macos.txt --clobber
          gh release view "$tag" --json assets --jq '"release now carries: " + ([.assets[].name] | join(", "))'

      # Publish the build log to the branch even on failure, because uploaded
      # Actions logs are not readable from every environment. The [skip ci]
      # marker and the path filter keep this from re-triggering a build.
      - name: Publish build log to the branch
        if: always()
        run: |
          set -uo pipefail
          mkdir -p macos/build-out
          if [ -f macos/build-out/build-log.txt ]; then
            tail -c 400000 macos/build-out/build-log.txt > macos/build-out/build-log.tail.txt
            mv macos/build-out/build-log.tail.txt macos/build-out/build-log.txt
          else
            echo "no build log produced" > macos/build-out/build-log.txt
          fi
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Ref ${GITHUB_REF_NAME} is a ${GITHUB_REF_TYPE}, not a branch: nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f macos/build-out
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git commit -m "ci: publish mac build log (run ${{ github.run_number }}) [skip ci]"
          # Android and Mac build on the same push and may publish their logs
          # in either order. Rebase over the other job's log commit instead of
          # failing a successful installer build with a non-fast-forward push.
          # This commit only touches generated build output, so when an earlier
          # run (even a cancelled one) published the same files, ours win
          # (-X theirs is the commit being replayed). A plain rebase stopped on
          # that conflict and left every retry failing. --autostash: a
          # non-default version build edits package.json (npm version), and a
          # dirty tree made 'git pull --rebase' refuse to start.
          for i in 1 2 3; do
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase --autostash -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
