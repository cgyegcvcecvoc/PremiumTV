name: Probe WGAL / Crime 360 candidates

# TEMPORARY verification workflow for the 2026-11-25 source audit.
# It answers one question the sandbox running the audit cannot: does each
# candidate WGAL feed (and each TV-network Crime 360 feed) actually answer from
# a GitHub runner's network? Removed at the end of the audit.

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/aa12d600-premiumtv"
    paths:
      - ".github/workflows/probe-wgal.yml"

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe candidate endpoints
        shell: bash
        continue-on-error: true
        run: |
          set +e
          {
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          probe() {
            local label="$1"; local url="$2"; shift 2
            echo "=================================================================="
            echo "## $label"
            echo "   $url"
            local out
            out=$(curl -sS -L -m 25 --max-redirs 5 -A "$UA" -H "Accept: */*" "$@" \
                    -o /tmp/body -w "status=%{http_code} type=%{content_type} size=%{size_download} final=%{url_effective}" \
                    "$url" 2>&1) || out="curl-error: $out"
            echo "   $out"
            if [ -s /tmp/body ]; then
              echo "   first lines:"
              head -c 400 /tmp/body | sed 's/^/     /'
              echo
            fi
            rm -f /tmp/body
          }

          probe2() {
            local label="$1"; local url="$2"
            echo "=================================================================="
            echo "## $label"
            echo "   $url"
            local code
            code=$(curl -sS -L -m 20 --max-redirs 4 -A "$UA" -H "Accept: */*" -o /tmp/body -w "%{http_code}" "$url" 2>/dev/null)
            echo "   status=$code"
            if [ "$code" = "200" ]; then
              echo "   variants (RESOLUTION/BANDWIDTH):"
              grep -o 'RESOLUTION=[0-9x]*' /tmp/body | sort -u | sed 's/^/     /' | head -10
              grep -o 'BANDWIDTH=[0-9]*' /tmp/body | sort -t= -k2 -n | tail -3 | sed 's/^/     /'
              echo "   EXT-X-STREAM-INF count: $(grep -c 'EXT-X-STREAM-INF' /tmp/body)"
            else
              head -c 200 /tmp/body | sed 's/^/     /'
              echo
            fi
          }

          echo "########## WGAL: how narrow can the Local Now URL be? ##########"
          probe2 "A. bare base + upstream identity params (lean)" \
            "https://s5host3.localnow.api.cms.amdvids.com/v1/master/c189661feba961c19bc5fb60b57879ee9b84548a/config6/90f3abbfb17a4b6eba96038b1d4bd051/master.m3u8?page_url=https%253A%252F%252Flocalnow.com%252Fchannels%252Fcbs-news-chicago-hyperlocal&ua=Mozilla/5.0%20%28Windows%20NT%2010.0%3B%20Win64%3B%20x64%29%20AppleWebKit/537.36%20%28KHTML%2C%20like%20Gecko%29%20Chrome/122.0.0.0%20Safari/537.36&width=1920&app_version=0.0.0&ccpa_us_privacy=1YNY&device_devicetype=desktop_web&height=1080&ads.n1=rule_id&ads.n3=qp_content_id&ads.n4=content_name&ads.v4=EPG%20%7C%20WGAL%20Harrisburg%2C%20PA&ads.n21=w&ads.v21=1920&ads.n22=content_livestream&ads.v22=1&ads.n23=content_producer_name&ads.v23=Hearst%20Corporation&ads.n24=channel_title&ads.v24=EPG%20%20WGAL%20Harrisburg%2C%20PA&ads.n25=device_type&ads.v25=&ads.n26=network_name&ads.v26=wgal&ads.n27=app_name&ads.v27=&ads.n28=channel_genre&ads.v28=News&ads.n29=gpp_sid&ads.v29=&ads.n30=dnt&ads.v30=&ads.n31=ip&ads.n32=channel_ext_id&ads.v32=630e87de06b129f8820e48f3&ads.n33=channel_name&ads.v33=EPG%20%20WGAL%20Harrisburg%2C%20PA&ads.n34=app_bundle&ads.v34=&ads.n35=ua&ads.v35=Mozilla/5.0%20%28Windows%20NT%2010.0%3B%20Win64%3B%20x64%29%20AppleWebKit/537.36%20%28KHTML%2C%20like%20Gecko%29%20Chrome/122.0.0.0%20Safari/537.36&ads.n36=channel_language&ads.v36=en&ads.n37=channel_brand_id&ads.v37=AMDB012873&ads.n38=content_custom_3_param&ads.v38=channel&ads.n39=device_model&ads.v39=&ads.n40=channel_id&ads.n41=h&ads.v41=1080&ads.n42=app_store_url&ads.v42=&ads.n43=app_version&ads.v43=0.0.0&ads.n44=content_custom_1_param&ads.n45=content_type&ads.v45=channel&ads.n46=channel_company_id&ads.v46=AMDP500425&ads.n47=device_make&ads.v47=&ads.n48=pos&ads.v48=midroll&ads.n49=ifa_type&ads.v49=&ads.n50=channel_rating&ads.v50=TV-PG&ads.n51=content_provider&ads.v51=wgal&ads.n52=cust_devicename&ads.v52=desktop_web&ads.n53=gpp&ads.v53=&ads.n54=url&ads.v54=https%253A%252F%252Flocalnow.com%252Fchannels%252Fcbs-news-chicago-hyperlocal&ads.n55=did&ads.v55=&ads.n56=us_privacy&ads.v56=1YNY&ads.n57=channel_corp&ads.v57=Hearst%20Corporation&ads.n58=content_custom_2_param&ads.v58=AMDB012873"
          probe2 "B. base + Signature/Key-Pair-Id/Expires/Policy only" \
            "https://s5host3.localnow.api.cms.amdvids.com/v1/master/c189661feba961c19bc5fb60b57879ee9b84548a/config6/90f3abbfb17a4b6eba96038b1d4bd051/master.m3u8?Signature=GH3a3Iz%7EObieDeswS-rblKhE7rb5kICPXlOXq4VdRYdZNFEx4s4LTEm9X0HzShHgs4nrmvjJyJiZWYWKlJ609XS931GHrlzoZLbCJD9mjpbHWAfO0VppXz-AzhKHYSh1Y-yEgI2V%7E4v01wZJWdCsNK5bPER2fI3ENLFL0FRh4m8enYHC4GGJdqZ8a%7EmymVRTugSf54NTxfS4vHSc4pZB0tANkYkUjkGB5jcMjbKthNNFtrKhM0Z8NN9uMCOrut28pAXMoGYG9K2qZAn6EFe-k%7ExZcyHVAnYFhDI1oBiLiMojRLyEa2j5V%7Etl7TPJOEtbjtQ9iuG0QTuPdAINu5FRjg__&Key-Pair-Id=K1BEGSWP8YSEGF&Expires=4854278400&Policy=eyJTdGF0ZW1lbnQiOlt7IlJlc291cmNlIjoiaHR0cHM6Ly9zeW5kaWNhdGlvbi1hdXNlMS5jZi5jZG4udXBseW5rLmNvbS85MGYzYWJiZmIxN2E0YjZlYmE5NjAzOGIxZDRiZDA1MS8qIiwiQ29uZGl0aW9uIjp7IkRhdGVMZXNzVGhhbiI6eyJBV1M6RXBvY2hUaW1lIjo0ODU0Mjc4NDAwfX19XX0%3D"
          probe2 "C. bare base + one channel-name ad param" \
            "https://s5host3.localnow.api.cms.amdvids.com/v1/master/c189661feba961c19bc5fb60b57879ee9b84548a/config6/90f3abbfb17a4b6eba96038b1d4bd051/master.m3u8?ads.n4=content_name&ads.v4=WGAL"
          probe2 "D. bare base alone (control, expected 400)" \
            "https://s5host3.localnow.api.cms.amdvids.com/v1/master/c189661feba961c19bc5fb60b57879ee9b84548a/config6/90f3abbfb17a4b6eba96038b1d4bd051/master.m3u8"
          echo "=================================================================="
          echo "probe complete"
          } 2>&1 | tee /tmp/probe-results.txt

      - name: Publish the probe results as an issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/probe-results.txt ]; then body=/tmp/probe-results.txt; else echo "probe produced no output" > /tmp/empty.txt; body=/tmp/empty.txt; fi
          gh issue create --repo "$GITHUB_REPOSITORY"             --title "PROBE-RESULTS-${GITHUB_RUN_ID}"             --body-file "$body"             --assignee cgyegcvcecvoc || echo "issue create failed"
