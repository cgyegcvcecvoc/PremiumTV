name: Probe source candidates

# TEMPORARY verification workflow for the 2026-11-25 source audit.
# It answers one question the sandbox running the audit cannot: does each
# candidate WGAL feed (and each TV-network Crime 360 feed) actually answer from
# a GitHub runner's network? Removed at the end of the audit.

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/aa12d600-premiumtv"
    paths:
      - ".github/workflows/probe-wgal.yml"

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe candidate endpoints
        shell: bash
        continue-on-error: true
        run: |
          set +e
          {
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          probe() {
            local label="$1"; local url="$2"; shift 2
            echo "=================================================================="
            echo "## $label"
            echo "   $url"
            local out
            out=$(curl -sS -L -m 25 --max-redirs 5 -A "$UA" -H "Accept: */*" "$@" \
                    -o /tmp/body -w "status=%{http_code} type=%{content_type} size=%{size_download} final=%{url_effective}" \
                    "$url" 2>&1) || out="curl-error: $out"
            echo "   $out"
            if [ -s /tmp/body ]; then
              echo "   first lines:"
              head -c 400 /tmp/body | sed 's/^/     /'
              echo
            fi
            rm -f /tmp/body
          }

          probe2() {
            local label="$1"; local url="$2"
            echo "=================================================================="
            echo "## $label"
            echo "   $url"
            local code
            code=$(curl -sS -L -m 20 --max-redirs 4 -A "$UA" -H "Accept: */*" -o /tmp/body -w "%{http_code}" "$url" 2>/dev/null)
            echo "   status=$code"
            if [ "$code" = "200" ]; then
              echo "   variants (RESOLUTION/BANDWIDTH):"
              grep -o 'RESOLUTION=[0-9x]*' /tmp/body | sort -u | sed 's/^/     /' | head -10
              grep -o 'BANDWIDTH=[0-9]*' /tmp/body | sort -t= -k2 -n | tail -3 | sed 's/^/     /'
              echo "   EXT-X-STREAM-INF count: $(grep -c 'EXT-X-STREAM-INF' /tmp/body)"
            else
              head -c 200 /tmp/body | sed 's/^/     /'
              echo
            fi
          }

          echo "########## Pluto TV: which addressing actually answers? ##########"
          probe "jmp2.uk/pluto.m3u (new primary)" \
            "https://jmp2.uk/pluto.m3u"
          probe "i.mjh.nz/PlutoTV/us.m3u8 (mirror 1)" \
            "https://i.mjh.nz/PlutoTV/us.m3u8"
          probe "raw.githubusercontent matthuisman i.mjh.nz (mirror 2)" \
            "https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/PlutoTV/us.m3u8"
          probe "old OwnerPlugins file (current source)" \
            "https://raw.githubusercontent.com/OwnerPlugins/pluto-tv-m3u/main/pluto-live-US.m3u"
          echo "########## XTEMUS: does the narrowed W3U still load? ##########"
          probe "XTEMUS playlist root" \
            "https://playlist.xtemus.com/?playlist=t256y454t41554"
          echo "=================================================================="
          echo "probe complete"
          } 2>&1 | tee /tmp/probe-results.txt

      - name: Publish the probe results as an issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/probe-results.txt ]; then body=/tmp/probe-results.txt; else echo "probe produced no output" > /tmp/empty.txt; body=/tmp/empty.txt; fi
          gh issue create --repo "$GITHUB_REPOSITORY"             --title "PROBE-RESULTS-${GITHUB_RUN_ID}"             --body-file "$body"             --assignee cgyegcvcecvoc || echo "issue create failed"
