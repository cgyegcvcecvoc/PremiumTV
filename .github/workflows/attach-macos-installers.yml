name: Attach Mac installers to a release

# Recovery path for when a Mac build succeeds on a commit that is not the
# release tag (for example after a runner-label fix) and the exact-SHA gate
# in macos-build.yml therefore leaves the Actions artifact unattached.
# Runs on GitHub-hosted Ubuntu so it can reach Actions artifact storage.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Actions run id that uploaded PremiumTV-macOS-installers-*"
        type: string
        required: true
      tag:
        description: "Release tag to attach to (for example v1.1.5)"
        type: string
        required: true

permissions:
  contents: write
  actions: read

jobs:
  attach:
    name: Attach Mac installers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download the Mac installer artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p installers
          gh run download "$RUN_ID" -D installers --repo "$GITHUB_REPOSITORY"
          find installers -type f -printf '%p %s\n'

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mapfile -t files < <(find installers -type f \( \
            -name "PremiumTV-${version}-mac-*.dmg" -o \
            -name "PremiumTV-${version}-mac-*.pkg" -o \
            -name "SHA256SUMS-macos.txt" \))
          if [ "${#files[@]}" -lt 5 ]; then
            echo "::error::Expected 4 installers + SHA256SUMS-macos.txt, found: ${files[*]:-none}"
            find installers -type f
            exit 1
          fi
          tagged=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG" | cut -f1)
          {
            printf 'PremiumTV %s\n' "$version"
            printf 'Source commit: %s\n' "${tagged:-unknown}"
            printf 'Build: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$RUN_ID"
          } > BUILD-SOURCE-macos.txt
          gh release upload "$TAG" "${files[@]}" BUILD-SOURCE-macos.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '"release now carries: " + ([.assets[].name] | join(", "))'
