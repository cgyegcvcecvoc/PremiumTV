name: Scrape playlists

# Runs three times a day on New York time (EDT/EST changes are handled by
# GitHub's timezone-aware schedule):
#   03:00  regular daily scrape
#   06:00  recheck
#   16:15  final daily check
# Every scheduled check fetches all configured playlist sources and tests links.
on:
  schedule:
    - cron: "0 3 * * *"
      timezone: "America/New_York"
    - cron: "0 6 * * *"
      timezone: "America/New_York"
    - cron: "15 16 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      skip_check:
        description: "Skip link checking (just merge sources)"
        type: boolean
        default: false
  # On-demand re-scrape without opening the Actions tab, e.g.
  #   gh api -X POST repos/<owner>/<repo>/dispatches -f event_type=scrape-now \
  #     -f 'client_payload[label]=manual re-scrape'
  repository_dispatch:
    types: [scrape-now]

permissions:
  contents: write

concurrency:
  group: scrape-playlists
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline scraper tests
        run: python -m unittest discover -s tests -v

      - name: Pick run label
        id: label
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_LABEL: ${{ github.event.client_payload.label }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            # Keep the label on one line: it is copied into the commit message.
            label="$(printf '%s' "${DISPATCH_LABEL:-manual run}" | tr -d '\n\r' | cut -c1-80)"
            echo "label=${label:-manual run}" >> "$GITHUB_OUTPUT"
          else
            case "$SCHEDULE" in
              "0 3 * * *")   echo "label=3:00 AM daily scrape"  >> "$GITHUB_OUTPUT" ;;
              "0 6 * * *")   echo "label=6:00 AM recheck"       >> "$GITHUB_OUTPUT" ;;
              "15 16 * * *") echo "label=4:15 PM final check"   >> "$GITHUB_OUTPUT" ;;
              *)             echo "label=manual run"            >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Run scraper
        id: scraper
        # Keep going long enough to publish STATUS.md/report.json/run-history.jsonl
        # even when the scraper correctly refuses to replace a bad playlist.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EJA_M3U_URL: ${{ secrets.EJA_M3U_URL }}
          STEPDADDYLIVEHD_PLAYLIST_URL: ${{ secrets.STEPDADDYLIVEHD_PLAYLIST_URL }}
          SCRAPER_LABEL: ${{ steps.label.outputs.label }}
          SKIP_CHECK: ${{ inputs.skip_check }}
        run: |
          args=(--label "$SCRAPER_LABEL")
          if [ "$SKIP_CHECK" = "true" ]; then args+=(--no-check); fi
          python scripts/scraper.py "${args[@]}"

      - name: Add scraper status to the Actions summary
        if: always() && steps.scraper.outcome != 'skipped'
        run: |
          if [ -f playlists/STATUS.md ]; then
            cat playlists/STATUS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The scraper did not write playlists/STATUS.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit playlists and run diagnostics
        if: always() && steps.scraper.outcome != 'skipped'
        env:
          SKIP_CHECK: ${{ inputs.skip_check }}
          SCRAPER_LABEL: ${{ steps.label.outputs.label }}
        run: |
          # An unchecked manual merge must never publish unverified player links.
          if [ "$SKIP_CHECK" = "true" ]; then
            if git ls-files --error-unmatch playlists/PremiumTV.m3u >/dev/null 2>&1; then
              git restore --source=HEAD --worktree -- playlists/PremiumTV.m3u
            else
              rm -f playlists/PremiumTV.m3u
            fi
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists/
          if git diff --cached --quiet; then
            echo "No playlist or diagnostic changes to commit."
            exit 0
          fi
          git commit -m "Scraper run: $SCRAPER_LABEL ($(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z'))"
          # Scheduled runs update main. Manual runs update only the selected branch.
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1

      - name: Fail the workflow if the scraper reported failure
        if: steps.scraper.outcome != 'success'
        run: exit 1
