name: Scrape playlists

# Runs seven times a day on New York time (EDT/EST changes are handled by
# GitHub's timezone-aware schedule) - roughly every three hours, so a link that
# dies in the morning is out of the player playlist by the afternoon:
#   03:07  regular daily scrape
#   06:23  recheck
#   09:41  recheck
#   12:53  recheck
#   16:41  final daily check
#   20:17  recheck
#   23:29  overnight recheck
#
# The minutes are deliberately not 0 or 15. GitHub starts scheduled runs late
# under load and the top of the hour is its busiest moment: on this repository
# every scheduled run between 2026-09-27 and 2026-09-29 started 2.8-8.1 hours
# after its intended time and three slots never ran at all. Off-peak minutes
# reduce that, and .github/workflows/schedule-guard.yml catches up on whatever
# GitHub still delays or drops.
#
# Every scheduled check fetches all configured playlist sources and tests links.
on:
  schedule:
    - cron: "7 3 * * *"
      timezone: "America/New_York"
    - cron: "23 6 * * *"
      timezone: "America/New_York"
    - cron: "41 9 * * *"
      timezone: "America/New_York"
    - cron: "53 12 * * *"
      timezone: "America/New_York"
    - cron: "41 16 * * *"
      timezone: "America/New_York"
    - cron: "17 20 * * *"
      timezone: "America/New_York"
    - cron: "29 23 * * *"
      timezone: "America/New_York"
  # "Run it now" switch without opening the Actions tab, the same pattern the
  # deep check and the guide build use: appending a line to
  # playlists/logs/run-scrape.txt and pushing runs a full checked scrape on that
  # branch. The workflow never writes to that file, so it cannot trigger itself.
  push:
    # Tag pushes (release tags) must not run the pipeline; path filters are
    # not evaluated for tags and would fire every workflow on each release.
    # The explicit branches filter is required for the paths filter to be
    # evaluated at all on branch pushes - a tags-ignore-only push block
    # silently never fires (the same shape as android-build.yml).
    branches:
      - "**"
    tags-ignore:
      - "**"
    paths:
      - "playlists/logs/run-scrape.txt"
  workflow_dispatch:
    inputs:
      skip_check:
        description: "Skip link checking (just merge sources)"
        type: boolean
        default: false
  # On-demand re-scrape without opening the Actions tab, e.g.
  #   gh api -X POST repos/<owner>/<repo>/dispatches -f event_type=scrape-now \
  #     -f 'client_payload[label]=manual re-scrape'
  # The schedule guard uses the same event to catch up on a late or dropped slot.
  repository_dispatch:
    types: [scrape-now]

permissions:
  contents: write

concurrency:
  # Per branch: the switches in playlists/logs/*.txt are meant to be pushed on
  # whatever branch you are working on, and GitHub cancels older *pending* runs in
  # the same group - with one repository-wide group, a manual run on a branch was
  # dropped by the next scheduled run on main. Runs on one branch still serialize.
  group: scrape-playlists-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run offline scraper tests
        run: python -m unittest discover -s tests -v

      - name: Pick run label and scheduled time
        id: label
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_LABEL: ${{ github.event.client_payload.label }}
          DISPATCH_SCHEDULED_FOR: ${{ github.event.client_payload.scheduled_for }}
        run: |
          # Keep every label on one line: it is copied into the commit message.
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            # The schedule guard sends the slot it is catching up on, including
            # when that slot was supposed to start.
            label="$(printf '%s' "${DISPATCH_LABEL:-manual run}" | tr -d '\n\r' | cut -c1-80)"
            scheduled_for="$(printf '%s' "$DISPATCH_SCHEDULED_FOR" | tr -d '\n\r' | cut -c1-40)"
          elif [ "$EVENT_NAME" = "push" ]; then
            # The "run it now" switch: a push to playlists/logs/run-scrape.txt.
            label="manual re-scrape (run-scrape.txt)"
            scheduled_for=""
          elif [ -n "$SCHEDULE" ]; then
            # Derive both from the same schedule the guard reads, so the workflow
            # and the guard can never disagree about what a slot is called or
            # when it was due. The `|| true` keeps a guard hiccup from failing the
            # whole scrape; the fallbacks below still produce a usable label.
            label="$(python scripts/schedule_guard.py label-for --cron "$SCHEDULE" || true)"
            scheduled_for="$(python scripts/schedule_guard.py scheduled-for --cron "$SCHEDULE" || true)"
          else
            label="manual run"
            scheduled_for=""
          fi
          echo "label=${label:-manual run}" >> "$GITHUB_OUTPUT"
          echo "scheduled_for=$scheduled_for" >> "$GITHUB_OUTPUT"
          echo "Label: ${label:-manual run} | scheduled for: ${scheduled_for:-n/a}"

      - name: Run scraper
        id: scraper
        # Keep going long enough to publish STATUS.md/report.json/run-history.jsonl
        # even when the scraper correctly refuses to replace a bad playlist.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EJA_M3U_URL: ${{ secrets.EJA_M3U_URL }}
          STEPDADDYLIVEHD_PLAYLIST_URL: ${{ secrets.STEPDADDYLIVEHD_PLAYLIST_URL }}
          DLIVE_M3U_URL: ${{ secrets.DLIVE_M3U_URL }}
          SCRAPER_LABEL: ${{ steps.label.outputs.label }}
          SCHEDULED_FOR: ${{ steps.label.outputs.scheduled_for }}
          SKIP_CHECK: ${{ inputs.skip_check }}
        run: |
          args=(--label "$SCRAPER_LABEL")
          # Records how late GitHub started this run, which is the number that
          # shows whether the schedule is actually being honoured.
          if [ -n "$SCHEDULED_FOR" ]; then args+=(--scheduled-for "$SCHEDULED_FOR"); fi
          if [ "$SKIP_CHECK" = "true" ]; then args+=(--no-check); fi
          python scripts/scraper.py "${args[@]}"

      - name: Add scraper status to the Actions summary
        if: always() && steps.scraper.outcome != 'skipped'
        run: |
          if [ -f playlists/STATUS.md ]; then
            cat playlists/STATUS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The scraper did not write playlists/STATUS.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rebuild the category order and per-category playlists
        # The scraper already publishes in the curated category order; this pass
        # adds the guide-id corrections and writes playlists/categories/*.m3u
        # (Sports, Cartoons, PBS, Game Shows, ... each on its own URL).
        if: always() && steps.scraper.outcome != 'skipped'
        id: categories
        continue-on-error: true
        env:
          SCRAPER_LABEL: ${{ steps.label.outputs.label }}
        run: |
          python scripts/rebuild_playlists.py --label "$SCRAPER_LABEL"

      - name: Refresh the merged and country-specific TV guides
        # Keeps all published XMLTV files in step with the channels this scrape
        # just published. The builder's freshness check also compares the
        # guide-relevant M3U channel set, so a changed channel list rebuilds now;
        # unchanged inputs keep the 12-hour throttle.
        if: always() && steps.scraper.outcome != 'skipped'
        continue-on-error: true
        run: |
          python scripts/epg_build.py --patch --countries --max-age-hours 12 \
            --label "guide refresh with the scrape"

      - name: Publish the live app feed and enforce the legacy sunset
        # PremiumTV 1.0.5+ refreshes playlists/live/USA.m3u; 1.0.0-1.0.4 refresh
        # playlists/countries/USA.m3u, which this pins on the end-of-support date
        # published in app-update-notice.json. Running here - after the playlists
        # are written and before the shelf is built - is what keeps the shelf, the
        # download site and the next APK on live channels when the legacy feed
        # freezes, and what puts the "go and update" notice in front of builds
        # too old to carry the popup.
        if: always()
        continue-on-error: true
        run: python scripts/legacy_sunset.py apply

      - name: Publish the categories/ shelf
        # The headline file a player is pointed at: categories/USA.m3u (every US
        # channel, in category order) plus one file per category for the USA and
        # for the whole library. Each file is a slice of the playlist the scrape
        # just published, so its sorting is the published sorting; the verify step
        # below re-plans the shelf and fails if a committed file is stale.
        if: always() && steps.scraper.outcome != 'skipped'
        id: shelf
        continue-on-error: true
        env:
          SCRAPER_LABEL: ${{ steps.label.outputs.label }}
        run: python scripts/build_categories.py --label "$SCRAPER_LABEL"

      - name: Verify the published playlists and guides
        # Offline cross-check of everything this workflow just did: canonical
        # categories and order, no link the deep check called dead, and every
        # advertised guide declaring the channels in front of it. --strict makes
        # a structural problem fail the step; it is continue-on-error so the
        # reports below are still committed and visible.
        if: always()
        id: verify
        continue-on-error: true
        run: |
          # Run once, publish the report to the summary, then keep the exit code
          # so a structural problem still fails the step (and the workflow).
          code=0
          # --require-shelf makes the categories/ shelf part of the contract: a
          # missing or stale shelf fails this step like a mis-sorted playlist.
          python scripts/verify_playlists.py --strict --require-shelf || code=$?
          if [ -f playlists/checks/VERIFY.md ]; then
            echo "-----" >> "$GITHUB_STEP_SUMMARY"
            cat playlists/checks/VERIFY.md >> "$GITHUB_STEP_SUMMARY"
          fi
          # Backup-specific contract: unique "(Backup N)" names, every backup
          # has its primary, and every playlists/categories file is an exact
          # slice of the published playlist. Writes checks/BACKUP-AUDIT.md.
          python scripts/audit_backups.py --strict || code=$?
          # The legacy feed must be pinned once support ends, and the
          # live feed must never carry the sanctioned notice entry.
          python scripts/legacy_sunset.py check || code=$?
          if [ -f playlists/checks/BACKUP-AUDIT.md ]; then
            echo "-----" >> "$GITHUB_STEP_SUMMARY"
            cat playlists/checks/BACKUP-AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: Commit playlists and run diagnostics
        if: always() && steps.scraper.outcome != 'skipped'
        env:
          SKIP_CHECK: ${{ inputs.skip_check }}
          SCRAPER_LABEL: ${{ steps.label.outputs.label }}
        run: |
          # An unchecked manual merge must never publish unverified player links.
          if [ "$SKIP_CHECK" = "true" ]; then
            if git ls-files --error-unmatch playlists/PremiumTV.m3u >/dev/null 2>&1; then
              git restore --source=HEAD --worktree -- playlists/PremiumTV.m3u
            else
              rm -f playlists/PremiumTV.m3u
            fi
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EPG playlists/ categories/
          if git diff --cached --quiet; then
            echo "No playlist or diagnostic changes to commit."
            exit 0
          fi
          git commit -m "Scraper run: $SCRAPER_LABEL ($(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z'))"
          # Scheduled runs update main. Manual runs update only the selected branch.
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1

      - name: Fail the workflow if the scraper reported failure
        if: steps.scraper.outcome != 'success'
        run: exit 1
