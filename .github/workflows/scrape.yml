name: Scrape playlists

# Runs three times a day on New York time (EDT in summer, EST in winter;
# GitHub adjusts for daylight saving automatically via `timezone`):
#   03:00  daily scrape
#   06:00  recheck (3 hours later)
#   16:15  final daily check
# Every run does the same full job: fetch all sources, merge, dedupe, test links.
on:
  schedule:
    - cron: "0 3 * * *"
      timezone: "America/New_York"
    - cron: "0 6 * * *"
      timezone: "America/New_York"
    - cron: "15 16 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      skip_check:
        description: "Skip link checking (just merge sources)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape-playlists
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick run label
        id: label
        run: |
          case "${{ github.event.schedule }}" in
            "0 3 * * *")   echo "label=3:00 AM daily scrape"  >> "$GITHUB_OUTPUT" ;;
            "0 6 * * *")   echo "label=6:00 AM recheck"       >> "$GITHUB_OUTPUT" ;;
            "15 16 * * *") echo "label=4:15 PM final check"   >> "$GITHUB_OUTPUT" ;;
            *)             echo "label=manual run"            >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--label "${{ steps.label.outputs.label }}")
          if [ "${{ inputs.skip_check }}" = "true" ]; then args+=(--no-check); fi
          python scripts/scraper.py "${args[@]}"

      - name: Commit updated playlists to the run's branch
        run: |
          # --no-check must never replace the checked player URL with untested links.
          # The all-links list, caches and status may still be refreshed.
          if [ "${{ inputs.skip_check }}" = "true" ]; then
            git restore -- playlists/PremiumTV.m3u
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update playlists: ${{ steps.label.outputs.label }} ($(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z'))"
          # Scheduled runs always use main; a manually dispatched run on a test
          # branch must never accidentally publish its result to main.
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
