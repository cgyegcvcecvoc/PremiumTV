name: Build PremiumTV Android APK

# Builds the Android TV app. This repository cannot be compiled from a plain
# sandbox (no JDK, no Android SDK, no Maven/Google mirror), so GitHub Actions
# is the build environment: it bakes the channel list and the guide into the
# APK and uploads both a ready-to-install debug build and an unsigned release
# build the owner can sign with their own key.
#
#   PremiumTV-<version>-debug.apk             install as-is (debug key)
#   PremiumTV-<version>-release-unsigned.apk  sign before publishing
#
# The debug APK is signed with the standard Android debug key, so it installs
# on a TV, a stick or a phone with no extra steps.

on:
  push:
    branches:
      - "**"
    paths:
      - "android/**"
      - "playlists/countries/**"
      - "EPG/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bake the playlists and guide into the app
        run: |
          python3 android/tools/build_bundle.py
          ls -la android/app/src/main/assets/bundle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Collect the APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          version=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')
          version=${version:-1.0.0-beta}
          echo "VERSION=$version" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/PremiumTV-${version}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/PremiumTV-${version}-release-unsigned.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: premiumtv-apk-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach the APKs to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}
