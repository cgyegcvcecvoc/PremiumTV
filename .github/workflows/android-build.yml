name: Build PremiumTV Android APK

# Builds the Android TV app. This repository cannot be compiled from a plain
# sandbox (no JDK, no Android SDK, no Maven/Google mirror), so GitHub Actions
# is the build environment: it bakes the channel list and the guide into the
# APK and publishes a ready-to-install debug build signed with the long-lived
# update key in android/keystore, so each release installs over the previous
# one from Settings -> App updates.
#
#   PremiumTV-<version>-debug.apk             install as-is
#
# The unsigned release APK was dropped in beta 2: an unsigned APK cannot be
# installed on a device, so it was never a usable download.
#
# Output goes to build-out/ and is committed back to the branch, because that
# is the only channel every environment can read: uploaded Actions artifacts
# live behind results-receiver.actions.githubusercontent.com, which is not
# reachable from every sandbox. The [skip ci] marker and the path filter below
# keep this from triggering another build.
#
# Release flow: artifacts attach only to the exact-SHA release being built.
# Every stable release is a full release; every 1.0.x build uses the USA
# lineup and every preview uses the global lineup. Versions and versionCodes
# come from scripts/release_version.py, so a future release cannot ship a
# versionCode below the installed app.
# emulator smoke gate depends on the "Free disk space for the emulator" step -
# do not grow the AVD data partition past the runner's free disk.

on:
  push:
    branches:
      - "**"
    paths:
      - "android/**"
      - "playlists/countries/**"
      # The USA bundle, shelf and site all read the live feed now, so a
      # change there has to rebuild them too.
      - "playlists/live/**"
      - "playlists/PremiumTV.m3u"
      - "categories/index.json"
      - "EPG/**"
      - "tests/test_android_bundle.py"
      - "tests/test_android_refresh.py"
      - "scripts/release_version.py"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (for example 1.0.8.1 stable)"
        type: string
        default: "1.0.8.1"
        required: true
      channel:
        description: "Release channel: stable = USA lineup, preview = global lineup"
        type: choice
        options:
          - stable
          - preview
        default: stable
        required: true
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    # Every published release is built for both platforms. The upload step
    # below still requires the release tag to point at this exact commit
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # Push builds default to stable 1.0.8.1 (1.0.8 V1 Patch); release and manual builds
      # select the tag/version they were asked for.
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', github.event.inputs.version || '1.0.8.1') }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve version, bundle scope and Android version code
        id: release-config
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            version=$(python3 scripts/release_version.py --normalize "$RELEASE_TAG") || {
              echo "Unsupported release tag: $RELEASE_TAG"; exit 1; }
            if [ "$RELEASE_PRERELEASE" = "true" ]; then channel=preview; else channel=stable; fi
          else
            version="${INPUT_VERSION:-1.0.8.1}"
            channel="${INPUT_CHANNEL:-stable}"
            version=$(python3 scripts/release_version.py --normalize "$version") || {
              echo "Unsupported PremiumTV version: $version"; exit 1; }
          fi
          if [ "$channel" = "preview" ]; then scope=all; else scope=usa; fi
          code=$(python3 scripts/release_version.py --code "$version")
          # A compatibility alias (1.0.7 for 1.0.6.1, 1.0.9 for 1.0.8.1 …) exists
          # so a three-part updater can reach the canonical build. The APK is
          # named and tagged with the alias, but its package must report the
          # canonical version: otherwise the updated app calls itself a preview
          # above the stable release on the next update check. The versionCode
          # stays the alias' higher code so it installs over the prior patch.
          # Patch releases after 1.0.8 follow the V scheme: V1=1.0.8.1, V2=1.0.8.2 …
          app_version=$(python3 scripts/release_version.py --canonical "$version")
          {
            echo "VERSION=$version"
            echo "APP_VERSION=$app_version"
            echo "RELEASE_TAG=v$version"
            echo "BUNDLE_SCOPE=$scope"
            echo "VERSION_CODE=$code"
            echo "CHANNEL=$channel"
          } >> "$GITHUB_ENV"
          echo "Building PremiumTV $app_version (release $version, $channel, scope=$scope, versionCode=$code)."

      - name: Verify the app bundle and refresh wiring
        run: python3 -m unittest tests.test_android_bundle tests.test_android_refresh -v

      - name: Bake the selected playlist and guide into the app
        run: |
          set -euo pipefail
          mkdir -p build-out
          python3 android/tools/build_bundle.py --scope "$BUNDLE_SCOPE" --version "$APP_VERSION" | tee build-out/bundle-log.txt
          ls -la android/app/src/main/assets/bundle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build the debug APK
        id: gradle
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          mkdir -p "$GITHUB_WORKSPACE/build-out"
          ./gradlew --no-daemon --stacktrace \
            -PpremiumTvVersion="$APP_VERSION" \
            -PpremiumTvVersionCode="$VERSION_CODE" \
            testDebugUnitTest assembleDebug 2>&1 \
            | tee "$GITHUB_WORKSPACE/build-out/build-log.txt"

      # An APK can only replace an installed PremiumTV when both are signed by
      # the same key.  The pinned certificate is the long-lived update identity
      # in android/keystore; fail the build if a runner falls back to a fresh
      # debug key, because that APK could never install over the published app.
      - name: Verify the update signing identity
        run: |
          set -euo pipefail
          expected=$(tr -d '[:space:]' < android/keystore/fingerprint.txt)
          actual=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk \
            | awk -F'SHA256: ' '/SHA256:/ {gsub(/:/, "", $2); print tolower($2); exit}')
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK signing certificate $actual does not match the pinned update key $expected"
            exit 1
          fi
          echo "APK is signed with the pinned PremiumTV update key ($expected)."

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner disk is nearly full by the time the SDK, the Gradle build
      # and this checkout are on it (~6.7 GB free), while a default AVD data
      # partition needs ~7.4 GB: the emulator died instantly with "Not enough
      # space to create userdata partition" and the boot wait simply polled
      # until its timeout, skipping the APK collect/attach steps below.
      # Reclaim the preinstalled toolchains this job never uses, and give the
      # AVD a 2 GB data partition - the smoke test only installs the APK and
      # dumps the UI hierarchy, so it needs neither the space nor a GPU.
      - name: Free disk space for the emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Smoke test the built APK (cold launch, relaunch, Guide tab and remote)
        id: smoke_apk
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          ram-size: 2048M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu off -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: python3 android/tools/smoke_apk.py

      - name: Collect the APKs
        id: collect_apks
        if: success()
        run: |
          set -euo pipefail
          mkdir -p build-out
          version=${VERSION:-1.0.3}
          cp android/app/build/outputs/apk/debug/app-debug.apk "build-out/PremiumTV-${version}-debug.apk"
          # Only the debug APK is published; drop any unsigned leftovers.
          rm -f build-out/*-release-unsigned.apk
          # build-out/ is committed back to the branch, so it can still hold
          # APKs from older releases; checksum only the APK this run built or
          # SHA256SUMS-android.txt gains a line for a file the release lacks
          # (the earlier release shipped with a stray PremiumTV-1.0.0-debug.apk line).
          (cd build-out && sha256sum "PremiumTV-${version}-debug.apk" > SHA256SUMS-android.txt)
          ls -la build-out

      - name: Upload smoke-tested APK as an Actions artifact
        uses: actions/upload-artifact@v6
        with:
          name: PremiumTV-Android-${{ env.VERSION }}
          path: |
            build-out/PremiumTV-${{ env.VERSION }}-debug.apk
            build-out/SHA256SUMS-android.txt
          if-no-files-found: error

      # Deliberately ordered before the branch push: on a tag build the branch
      # push cannot succeed (a branch and a tag may not share a name), and a
      # failed step would skip everything after it - which is exactly how the
      # release page ended up with no APK on it.
      - name: Attach the APKs to the release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          tag="${tag:-$RELEASE_TAG}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag does not exist; the APK stays in build-out/."
            exit 0
          fi
          tagged=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
          # GitHub creates a draft release's tag only when it is published.
          # Permit uploads to an untagged draft only for its exact target SHA.
          if [ -z "$tagged" ]; then
            tagged=$(gh release view "$tag" --json isDraft,targetCommitish --jq 'if .isDraft then .targetCommitish else "" end')
          fi
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            # Every release keeps the exact-SHA gate: a later branch build must
            # never overwrite the installers attached to a published tag.
            echo "Release $tag points to $tagged, not $GITHUB_SHA; keeping its assets."
            exit 0
          fi
          printf 'PremiumTV %s%s\nSource commit: %s\nBuild: https://github.com/%s/actions/runs/%s\n' "$VERSION" \
            "$([ "$APP_VERSION" != "$VERSION" ] && printf ' (installs as %s)' "$APP_VERSION")" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > build-out/BUILD-SOURCE-android.txt
          gh release upload "$tag" \
            "build-out/PremiumTV-${VERSION}-debug.apk" build-out/SHA256SUMS-android.txt build-out/BUILD-SOURCE-android.txt --clobber
          gh release view "$tag" --json assets --jq '"release now carries: " + ([.assets[].name] | join(", "))'

      - name: Publish build output to the branch
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.smoke_apk.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect_apks.outcome }}
        run: |
          set -uo pipefail
          mkdir -p build-out
          # Keep the log small enough to read: the tail holds the failure, and
          # the compiler error lines are pulled out separately.
          if [ -f build-out/build-log.txt ]; then
            tail -c 400000 build-out/build-log.txt > build-out/build-log.tail.txt
            mv build-out/build-log.tail.txt build-out/build-log.txt
            grep -E "^(e: |w: .*error|FAILURE:|\\* What went wrong|Execution failed|\> Task .*FAILED)" build-out/build-log.txt | head -120 > build-out/build-errors.txt || true
          fi
          if [ "${SMOKE_OUTCOME:-}" = "success" ] && [ "${COLLECT_OUTCOME:-}" = "success" ]; then
            cp android/app/src/main/assets/bundle/meta.json build-out/bundle-meta.json
          else
            echo "Keeping metadata paired with the last smoke-tested APK (smoke=${SMOKE_OUTCOME:-unknown}, collect=${COLLECT_OUTCOME:-unknown})."
          fi
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Ref ${GITHUB_REF_NAME} is a ${GITHUB_REF_TYPE}, not a branch: nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-out
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git commit -m "ci: publish APK build output (run ${{ github.run_number }}) [skip ci]"
          # The guide build, the Mac build and this one all publish to the same
          # branch and may finish in any order. Rebase over the other jobs'
          # commits instead of failing the build on a non-fast-forward push.
          # This commit only touches generated build output, so when an earlier
          # run (even a cancelled one) published the same files, ours win
          # (-X theirs is the commit being replayed). A plain rebase stopped on
          # that conflict and left every retry failing. --autostash: a
          # non-default version build edits package.json (npm version), and a
          # dirty tree made 'git pull --rebase' refuse to start.
          for i in 1 2 3; do
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase --autostash -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
