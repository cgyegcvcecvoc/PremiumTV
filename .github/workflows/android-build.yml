name: Build PremiumTV Android APK

# Builds the Android TV app. This repository cannot be compiled from a plain
# sandbox (no JDK, no Android SDK, no Maven/Google mirror), so GitHub Actions
# is the build environment: it bakes the channel list and the guide into the
# APK and publishes a ready-to-install debug build (signed with the standard
# debug key, so it installs as-is on a TV).
#
#   PremiumTV-<version>-debug.apk             install as-is
#
# The unsigned release APK was dropped in beta 2: an unsigned APK cannot be
# installed on a device, so it was never a usable download.
#
# Output goes to build-out/ and is committed back to the branch, because that
# is the only channel every environment can read: uploaded Actions artifacts
# live behind results-receiver.actions.githubusercontent.com, which is not
# reachable from every sandbox. The [skip ci] marker and the path filter below
# keep this from triggering another build.

on:
  push:
    branches:
      - "**"
    paths:
      - "android/**"
      - "playlists/countries/**"
      - "EPG/**"
      - "tests/test_android_bundle.py"
      - "tests/test_android_refresh.py"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    # Do not attach an Android APK to a Mac-only release; the official release
    # carries both platforms.
    if: github.event_name != 'release' || github.event.release.tag_name == 'v1.0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Push builds attach their APKs to this release too, so the download
      # links on the release page can never go stale or stay empty.
      RELEASE_TAG: v1.0.1

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify the app bundle and refresh wiring
        run: python3 -m unittest tests.test_android_bundle tests.test_android_refresh -v

      - name: Bake the playlists and guide into the app
        run: |
          mkdir -p build-out
          version=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')
          version=${version:-1.0.1}
          echo "VERSION=$version" >> "$GITHUB_ENV"
          python3 android/tools/build_bundle.py --version "$version" | tee build-out/bundle-log.txt
          ls -la android/app/src/main/assets/bundle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        id: gradle
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          mkdir -p "$GITHUB_WORKSPACE/build-out"
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 \
            | tee "$GITHUB_WORKSPACE/build-out/build-log.txt"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test cold launch and relaunch of the built APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: python3 android/tools/smoke_apk.py

      - name: Collect the APKs
        if: success()
        run: |
          set -euo pipefail
          mkdir -p build-out
          version=${VERSION:-1.0.1}
          cp android/app/build/outputs/apk/debug/app-debug.apk "build-out/PremiumTV-${version}-debug.apk"
          # Only the debug APK is published; drop any unsigned leftovers.
          rm -f build-out/*-release-unsigned.apk
          (cd build-out && sha256sum *.apk > SHA256SUMS-android.txt)
          ls -la build-out

      # Deliberately ordered before the branch push: on a tag build the branch
      # push cannot succeed (a branch and a tag may not share a name), and a
      # failed step would skip everything after it - which is exactly how the
      # release page ended up with no APK on it.
      - name: Attach the APKs to the release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          tag="${tag:-$RELEASE_TAG}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag does not exist; the APK stays in build-out/."
            exit 0
          fi
          tagged=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
          # GitHub creates a draft release's tag only when it is published.
          # Permit uploads to an untagged draft only for its exact target SHA.
          if [ -z "$tagged" ]; then
            tagged=$(gh release view "$tag" --json isDraft,targetCommitish --jq 'if .isDraft then .targetCommitish else "" end')
          fi
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "Release $tag points to $tagged, not $GITHUB_SHA; keeping its assets."
            exit 0
          fi
          gh release upload "$tag" \
            "build-out/PremiumTV-${VERSION}-debug.apk" build-out/SHA256SUMS-android.txt --clobber
          gh release view "$tag" --json assets --jq '"release now carries: " + ([.assets[].name] | join(", "))'

      - name: Publish build output to the branch
        if: always()
        run: |
          set -uo pipefail
          mkdir -p build-out
          # Keep the log small enough to read: the tail holds the failure, and
          # the compiler error lines are pulled out separately.
          if [ -f build-out/build-log.txt ]; then
            tail -c 400000 build-out/build-log.txt > build-out/build-log.tail.txt
            mv build-out/build-log.tail.txt build-out/build-log.txt
            grep -E "^(e: |w: .*error|FAILURE:|\\* What went wrong|Execution failed|\> Task .*FAILED)" build-out/build-log.txt | head -120 > build-out/build-errors.txt || true
          fi
          cp android/app/src/main/assets/bundle/meta.json build-out/bundle-meta.json 2>/dev/null || true
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Ref ${GITHUB_REF_NAME} is a ${GITHUB_REF_TYPE}, not a branch: nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-out
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git commit -m "ci: publish APK build output (run ${{ github.run_number }}) [skip ci]"
          # The guide build, the Mac build and this one all publish to the same
          # branch and may finish in any order. Rebase over the other jobs'
          # commits instead of failing the build on a non-fast-forward push.
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
