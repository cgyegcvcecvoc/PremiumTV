name: Repository checks

# The data pipelines (scrape, quick-update, link-check, cleanup, discovery) all
# run the offline suite as their first step, so a broken script or test merged
# into main stops every playlist publication - hours later, inside a data run's
# log. This is the pre-merge gate: the same suite, plus the repository's own
# playlist/EPG/shelf invariants, run against the commit itself.
#
# Read-only by design (no commit, no push), so it can never race a data
# workflow's publishing push.

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "**"
    # Tag pushes (release tags) must not run the checks; path filters are not
    # evaluated for tags and would fire this workflow on each release. The
    # explicit branches filter is required for the paths filter to be evaluated
    # at all on branch pushes (the same shape as the data workflows).
    tags-ignore:
      - "**"
    paths:
      - "scripts/**"
      - "tests/**"
      - "sources.json"
      - "playlists/PremiumTV.m3u"
      - "playlists/countries/**"
      - "playlists/live/**"
      - "playlists/local-channels.json"
      - "data/local-markets/**"
      - "categories/**"
      - "EPG/**"
      - "VERSION"
      - "README.md"
      - "app-update-notice.json"
      - "docs/UPDATES.md"
      - "release-notes-*.md"
      - "android/version.properties"
      - "android/app/build.gradle.kts"
      - "android/tools/build_bundle.py"
      - "macos/app/package.json"
      - "macos/app/package-lock.json"
      - "relay/**"
      - "web/**"
      - "macos/app/src/**"
      - "macos/app/test/**"
      - "hub/**"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/macos-build.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/web-build.yml"
      - ".github/workflows/legacy-sunset.yml"

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Offline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile every script and test module
        run: python -m compileall -q scripts tests

      - name: Check the release version has one source
        # VERSION is the only hand-edited copy; the README, update notice,
        # Gradle, Mac package, site generator and workflows are verified here.
        run: python scripts/version_sync.py --check

      - name: Check the legacy feed is in its published phase
        # The support deadline can pass between scheduled jobs. This read-only
        # guard makes a stale warning/frozen state fail the pre-merge suite
        # instead of every playlist publication hours later.
        run: python scripts/legacy_sunset.py check

      - name: Run the offline test suite
        run: python -m unittest discover -s tests -v

      - name: Check generated data against its generators
        run: |
          python scripts/build_live_schedule.py --check
          python scripts/build_local_channels.py --check
          python scripts/build_site_data.py --check

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Test the blocked-feed relay
        # No dependencies to install: relay/ is deliberately stdlib-only.
        run: node --test relay/test/relay.test.js

      - name: Install and test the web player
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Install and test macOS logic
        working-directory: macos/app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci
          npm test

      - name: Verify published playlists, guides and the categories/ shelf
        # Rewrites playlists/checks/VERIFY.md and verify.json with a fresh
        # generated_utc stamp. Harmless here: the job never commits.
        run: python scripts/verify_playlists.py --strict --require-shelf

      - name: Report the shelf plan
        run: python scripts/build_categories.py --dry-run

  android-unit:
    name: Android unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build the bundled library
        run: python3 android/tools/build_bundle.py --scope usa --version "$(cat VERSION)"
      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest
