name: Build merged and country EPG guides

# Publishes the all-country guide and one country-scoped XMLTV guide per M3U,
# all in the repository-root EPG/ folder (not under playlists/):
#
#   EPG/PremiumTV.xml          whole-library guide (plain XML)
#   EPG/PremiumTV.xml.gz       compact copy of the whole-library guide
#   EPG/USA.xml, EPG/UK.xml…   exact channel sets from playlists/countries/*.m3u
#
# scripts/epg_build.py uses only verified upstream XMLTV sources, normalises
# timestamps to UTC, removes placeholders, merges duplicates and resolves
# overlaps. Every country file is a standalone, valid XMLTV document, contains
# only that country's channel IDs, and is checked before publication. Country
# M3Us advertise their own one-file guide rather than asking IPTV players to
# download every country's schedule.
#
# Twice a day refreshes listings; freshness is additionally keyed to the
# guide-relevant channel metadata, so a changed M3U channel set is rebuilt even
# while the previous guide is young.
on:
  # "Run it now" switch, the same pattern link-check.yml uses: appending a line
  # to playlists/logs/run-epg-build.txt and pushing rebuilds the guide on that
  # branch. The workflow never writes to that file, so it cannot trigger itself.
  push:
    paths:
      - "playlists/logs/run-epg-build.txt"
  schedule:
    # 05:47 and 17:47 New York time. Off-peak minutes for the same reason as
    # scrape.yml: GitHub's scheduler is busiest at the top of the hour.
    - cron: "47 5 * * *"
      timezone: "America/New_York"
    - cron: "47 17 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      patch:
        description: "Advertise the merged guide and country-specific guides in playlist headers"
        type: boolean
        default: true
      ahead:
        description: "Hours of future listings to keep"
        type: string
        default: "48"
      max_mb:
        description: "Size budget for the plain .xml file (MB)"
        type: string
        default: "60"
      force:
        description: "Rebuild even if the published guide is recent"
        type: boolean
        default: true
  # On-demand rebuild without opening the Actions tab, e.g.
  #   gh api -X POST repos/<owner>/<repo>/dispatches -f event_type=epg-build-now
  repository_dispatch:
    types: [epg-build-now]

permissions:
  contents: write

concurrency:
  group: epg-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline EPG builder tests
        run: python -m unittest discover -s tests -p "test_epg_build.py" -v

      - name: Build the merged guide
        id: build
        continue-on-error: true
        env:
          PATCH: ${{ inputs.patch }}
          AHEAD: ${{ inputs.ahead }}
          MAX_MB: ${{ inputs.max_mb }}
          FORCE: ${{ inputs.force }}
        run: |
          # --countries: the ~180 country playlists advertise the guide too.
          # The scraper keeps it in place between builds; this restores it if a
          # playlist was ever rewritten without it.
          args=(--countries --workers 4 --timeout 120 --label "scheduled guide build")
          # Scheduled and dispatched runs always advertise the guide and always
          # rebuild; a manual run can hold back.
          if [ "${PATCH:-true}" != "false" ]; then args+=(--patch); fi
          if [ -n "$AHEAD" ]; then args+=(--ahead "$AHEAD"); fi
          if [ -n "$MAX_MB" ]; then args+=(--max-mb "$MAX_MB"); fi
          if [ "${FORCE:-true}" != "false" ]; then args+=(--force); fi
          python scripts/epg_build.py "${args[@]}"

      - name: Publish the categories/ shelf
        # The headline file a player is pointed at: categories/USA.m3u (every US
        # channel, in category order) plus one file per category for the USA and
        # for the whole library. Each file is a slice of a published playlist, so
        # its sorting is theirs; the verify step re-plans it and fails when a
        # committed file is stale.
        id: shelf
        continue-on-error: true
        run: python scripts/build_categories.py --label "scheduled guide build"

      - name: Verify the published playlists and guides
        # Offline cross-check of everything this workflow just did: canonical
        # categories and order, no link the deep check called dead, and every
        # advertised guide declaring the channels in front of it. --strict makes
        # a structural problem fail the step; it is continue-on-error so the
        # reports below are still committed and visible.
        if: always()
        id: verify
        continue-on-error: true
        run: python scripts/verify_playlists.py --strict --require-shelf

      - name: Add the guide report to the Actions summary
        if: always()
        run: |
          if [ -f playlists/checks/EPG-BUILD.md ]; then
            cat playlists/checks/EPG-BUILD.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The guide build did not write playlists/checks/EPG-BUILD.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit the guide and its reports
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EPG playlists/ categories/
          if git diff --cached --quiet; then
            echo "No guide or report changes to commit."
            exit 0
          fi
          git commit -m "Guide build: merged EPG refreshed ($(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z'))"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1

      - name: Fail the workflow if the build crashed
        if: steps.build.outcome == 'failure'
        run: exit 1
