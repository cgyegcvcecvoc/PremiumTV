name: Repair release copy

# One-shot repair, removed after a successful run:
#   * rewrite the v1.1.26 body from the corrected notes, which drop the
#     lagging Codeberg mirror;
#   * point two historical release bodies at the canonical repository instead
#     of the retired PremiumTV1 slug (its Pages blocked page is a 404).
#
# Delete this file once the run has succeeded.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-release-notes.yml

permissions:
  contents: write

jobs:
  repair:
    name: Repair release bodies
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the corrected notes
        uses: actions/checkout@v5

      - name: Rewrite v1.1.26 from the corrected notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v1.1.26 \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file release-notes-1.1.26.md
          gh release view v1.1.26 \
            --repo "$GITHUB_REPOSITORY" \
            --json body --jq .body > /tmp/v1.1.26.md
          if [ "$(cat release-notes-1.1.26.md)" != "$(cat /tmp/v1.1.26.md)" ]; then
            echo "::error::v1.1.26 body does not match release-notes-1.1.26.md"
            exit 1
          fi
          if grep -qi 'codeberg' /tmp/v1.1.26.md; then
            echo "::error::v1.1.26 body still mentions Codeberg"
            exit 1
          fi
          echo "v1.1.26 body matches the corrected notes."

      - name: Point historical bodies at the canonical repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in v1.0.6.1 v1.0.9; do
            gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json body --jq .body > "/tmp/$tag.md"
            sed -i 's|PremiumTV1|PremiumTV|g' "/tmp/$tag.md"
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file "/tmp/$tag.md"
            if gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json body --jq .body | grep -q 'PremiumTV1'; then
              echo "::error::$tag still contains PremiumTV1"
              exit 1
            fi
            echo "$tag now uses the canonical repository."
          done
